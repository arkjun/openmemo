name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test:run

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            test: true
          - os: macos-14
            target: darwin-x64
            test: false  # Cross-compiled, can't test on ARM64 runner
          - os: ubuntu-latest
            target: linux-x64
            test: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            test: true
          - os: windows-latest
            target: windows-x64
            test: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun run scripts/build-binaries.ts --target ${{ matrix.target }}

      - name: Test binary (Unix)
        if: matrix.test && runner.os != 'Windows'
        run: ./packages/openmemo-${{ matrix.target }}/openmemo help

      - name: Test binary (Windows)
        if: matrix.test && runner.os == 'Windows'
        run: ./packages/openmemo-${{ matrix.target }}/openmemo.exe help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmemo-${{ matrix.target }}
          path: packages/openmemo-${{ matrix.target }}/openmemo*
          if-no-files-found: error
